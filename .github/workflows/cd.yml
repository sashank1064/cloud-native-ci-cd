name: deploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy"
        required: true
      environment:
        description: "App environment label"
        required: true
        default: "dev"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      CLUSTER_NAME: ${{ vars.CLUSTER_NAME }}
      ECR_URI: ${{ vars.ECR_URI }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name "$CLUSTER_NAME" --region "$AWS_REGION"

      - name: Deploy user-service
        run: |
          helm upgrade --install user-service ./helm/user-service \
            --namespace default \
            --create-namespace \
            --set image.repository="$ECR_URI" \
            --set image.tag="${{ github.event.inputs.image_tag }}" \
            --set env.ENVIRONMENT="${{ github.event.inputs.environment }}" \
            --set env.VERSION="${{ github.event.inputs.image_tag }}" \
            --atomic \
            --wait \
            --timeout 10m
